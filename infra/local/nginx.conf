# Faz o papel do ALB localmente: round-robin entre as tasks, com upgrade para WebSocket.
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
}

http {
    upstream bid_service {
        # O DNS do Docker devolve um endereço por réplica; o nginx resolve no startup e faz round-robin.
        server app:8080;
        keepalive 256;
        # Menor que o keep-alive da app (75 s): quem fecha a conexão ociosa é sempre o proxy.
        keepalive_timeout 60s;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://bid_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Mesmo idle timeout do ALB; o ping de WebSocket da app (10 s) mantém a conexão viva.
            proxy_read_timeout 60s;
        }
    }
}
