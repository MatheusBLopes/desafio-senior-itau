<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#344054"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ec7000"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #101828; }
      .sub { font-size: 14px; fill: #475467; }
      .h { font-size: 15px; font-weight: 700; fill: #101828; }
      .t { font-size: 12.5px; fill: #344054; }
      .s { font-size: 11.5px; fill: #667085; }
      .lbl { font-size: 12px; fill: #101828; font-weight: 600; }
      .step { font-size: 12px; font-weight: 700; fill: #fff; }
      .box { fill: #fff; stroke: #98a2b3; stroke-width: 1.4; rx: 10; }
      .compute { fill: #fff4e5; stroke: #ec7000; stroke-width: 1.6; rx: 10; }
      .data { fill: #eef4ff; stroke: #2563eb; stroke-width: 1.6; rx: 10; }
      .ops { fill: #f2f4f7; stroke: #98a2b3; stroke-width: 1.2; rx: 10; }
      .flow { stroke: #344054; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .flowO { stroke: #ec7000; stroke-width: 2.2; fill: none; marker-end: url(#arrowOrange); }
      .flowB { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrowBlue); }
      .dash { stroke: #98a2b3; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1500" height="1030" fill="#ffffff"/>
  <text x="40" y="48" class="title">Leilão de alta concorrência — arquitetura AWS básica (provisionada pelo Terraform)</text>
  <text x="40" y="74" class="sub">us-east-1 · 2 AZs · sem NAT Gateway · Graviton (ARM64) · HA/DR documentados no README, não provisionados</text>

  <!-- Usuários -->
  <rect x="40" y="300" width="170" height="150" class="box"/>
  <text x="125" y="330" text-anchor="middle" class="h">Usuários</text>
  <text x="125" y="354" text-anchor="middle" class="t">navegador / app</text>
  <text x="125" y="380" text-anchor="middle" class="s">REST: lances com</text>
  <text x="125" y="396" text-anchor="middle" class="s">Idempotency-Key</text>
  <text x="125" y="420" text-anchor="middle" class="s">WebSocket (JSON)</text>
  <text x="125" y="436" text-anchor="middle" class="s">snapshots com seq</text>

  <!-- AWS Cloud -->
  <rect x="250" y="100" width="1220" height="900" rx="14" fill="none" stroke="#232f3e" stroke-width="2"/>
  <text x="270" y="126" class="h">AWS Cloud</text>

  <!-- VPC -->
  <rect x="270" y="140" width="820" height="840" rx="12" fill="#fcfcfd" stroke="#12805c" stroke-width="1.8" stroke-dasharray="8 5"/>
  <text x="290" y="166" class="h" fill="#12805c">VPC 10.20.0.0/16 (2 AZs)</text>

  <!-- Subnets públicas -->
  <rect x="290" y="180" width="780" height="400" rx="10" fill="#f6fef9" stroke="#12805c" stroke-width="1"/>
  <text x="305" y="202" class="lbl" fill="#12805c">Subnets públicas (IGW) — tasks com IP público, SG aceita só o ALB</text>

  <!-- ALB -->
  <rect x="310" y="300" width="170" height="150" class="compute"/>
  <text x="395" y="330" text-anchor="middle" class="h">Application LB</text>
  <text x="395" y="354" text-anchor="middle" class="t">HTTP + WebSocket</text>
  <text x="395" y="374" text-anchor="middle" class="s">nativo, sem sticky</text>
  <text x="395" y="394" text-anchor="middle" class="s">idle timeout 60 s</text>
  <text x="395" y="414" text-anchor="middle" class="s">health: /readyz</text>
  <text x="395" y="434" text-anchor="middle" class="s">multi-AZ</text>

  <!-- ECS -->
  <rect x="530" y="220" width="520" height="340" class="compute"/>
  <text x="550" y="246" class="h">ECS Fargate ARM64 — bid-service (2..10 tasks · 1 vCPU / 2 GB)</text>
  <text x="550" y="266" class="s">Python/asyncio · ~2.100 lances/s por task (medido) · on-demand + Spot · auto scaling</text>

  <rect x="550" y="282" width="235" height="262" class="box"/>
  <text x="667" y="304" text-anchor="middle" class="lbl">task (AZ a)</text>
  <text x="565" y="328" class="t">• load shedding + pré-filtro</text>
  <text x="565" y="348" class="t">• EVALSHA place_bid.lua</text>
  <text x="565" y="368" class="t">• Pub/Sub → cache local</text>
  <text x="565" y="388" class="t">• conflation → /ws/auctions/{id}</text>
  <text x="565" y="408" class="t">• consumer group do stream</text>
  <text x="565" y="428" class="t">• scheduler de encerramento</text>
  <text x="565" y="448" class="t">• reconciliador (reidratação)</text>
  <rect x="565" y="470" width="205" height="58" rx="8" fill="#f2f4f7" stroke="#98a2b3"/>
  <text x="667" y="492" text-anchor="middle" class="lbl">sidecar ADOT</text>
  <text x="667" y="512" text-anchor="middle" class="s">OTLP → X-Ray (5% sampling)</text>

  <rect x="800" y="282" width="235" height="262" class="box"/>
  <text x="917" y="304" text-anchor="middle" class="lbl">task (AZ b)</text>
  <text x="917" y="380" text-anchor="middle" class="t">mesma imagem,</text>
  <text x="917" y="400" text-anchor="middle" class="t">sem estado local de negócio</text>
  <text x="917" y="420" text-anchor="middle" class="s">(o cache só filtra; quem decide é o Lua)</text>
  <rect x="815" y="470" width="205" height="58" rx="8" fill="#f2f4f7" stroke="#98a2b3"/>
  <text x="917" y="492" text-anchor="middle" class="lbl">sidecar ADOT</text>
  <text x="917" y="512" text-anchor="middle" class="s">OTLP → X-Ray (5% sampling)</text>

  <!-- Subnets privadas -->
  <rect x="290" y="650" width="780" height="310" rx="10" fill="#f5f8ff" stroke="#2563eb" stroke-width="1"/>
  <text x="305" y="672" class="lbl" fill="#2563eb">Subnets privadas (sem internet)</text>

  <rect x="310" y="690" width="400" height="250" class="data"/>
  <text x="510" y="716" text-anchor="middle" class="h">ElastiCache for Valkey 8.1 (cache.t4g.micro)</text>
  <text x="325" y="742" class="t">Motor atômico: 1 script Lua por vez, sem lock distribuído</text>
  <text x="325" y="766" class="t">• auction:{id}  hash (preço, líder, seq, endsAt)</text>
  <text x="325" y="786" class="t">• idem:{id}:user:key  resposta memorizada (TTL ≥ fim + 24 h)</text>
  <text x="325" y="806" class="t">• bids:{id}  stream, ID 0-&lt;seq&gt;, MAXLEN ~100k</text>
  <text x="325" y="826" class="t">• auctions:ending  ZSET de prazos</text>
  <text x="325" y="846" class="t">• canal auction-events  Pub/Sub</text>
  <text x="325" y="870" class="s">TIME do servidor = relógio único · noeviction · TLS</text>
  <text x="325" y="890" class="s">hash tag {auctionId}: pronto para cluster mode</text>
  <text x="325" y="916" class="s">HA: réplica Multi-AZ (node_count = 2) · SG: só as tasks</text>

  <rect x="740" y="690" width="310" height="250" class="data"/>
  <text x="895" y="716" text-anchor="middle" class="h">RDS PostgreSQL 17</text>
  <text x="895" y="736" text-anchor="middle" class="s">db.t4g.micro · gp3 20 GB · Single-AZ</text>
  <text x="755" y="766" class="t">• auctions (cadastro + projeção)</text>
  <text x="755" y="786" class="t">• bids (só aceitos)</text>
  <text x="755" y="812" class="t">2ª barreira contra duplicidade:</text>
  <text x="755" y="832" class="s">PK (auction_id, seq)</text>
  <text x="755" y="850" class="s">UNIQUE (auction_id, user_id, idem_key)</text>
  <text x="755" y="868" class="s">INSERT ... ON CONFLICT DO NOTHING</text>
  <text x="755" y="896" class="s">fonte da reidratação do Valkey</text>
  <text x="755" y="916" class="s">HA: multi_az = true</text>

  <!-- Serviços gerenciados à direita -->
  <rect x="1120" y="160" width="330" height="96" class="ops"/>
  <text x="1135" y="186" class="h">Amazon ECR</text>
  <text x="1135" y="208" class="t">imagem ARM64, scan on push</text>
  <text x="1135" y="228" class="s">lifecycle: mantém as últimas 5</text>

  <rect x="1120" y="272" width="330" height="96" class="ops"/>
  <text x="1135" y="298" class="h">SSM Parameter Store</text>
  <text x="1135" y="320" class="t">senha do banco (SecureString)</text>
  <text x="1135" y="340" class="s">grátis no tier standard</text>

  <rect x="1120" y="384" width="330" height="190" class="ops"/>
  <text x="1135" y="410" class="h">Amazon CloudWatch</text>
  <text x="1135" y="434" class="t">Logs JSON (retenção 7 dias)</text>
  <text x="1135" y="454" class="t">Métricas Auction/* (sem auctionId</text>
  <text x="1135" y="472" class="t">  como dimensão) + nativas AWS</text>
  <text x="1135" y="494" class="t">Dashboard + 10 alarmes</text>
  <text x="1135" y="516" class="s">5xx, p95, CPU/mem ECS, Valkey CPU/mem,</text>
  <text x="1135" y="534" class="s">RDS CPU/conexões, backlog, colisões</text>
  <text x="1135" y="558" class="s">→ SNS → e-mail</text>

  <rect x="1120" y="590" width="330" height="80" class="ops"/>
  <text x="1135" y="616" class="h">AWS X-Ray</text>
  <text x="1135" y="640" class="t">traces via ADOT, sampling 5%</text>

  <rect x="1120" y="686" width="330" height="100" class="ops"/>
  <text x="1135" y="712" class="h">AWS Budgets + tags padrão</text>
  <text x="1135" y="734" class="t">alerta em 80% real / 100% previsto</text>
  <text x="1135" y="754" class="s">project · env · owner · cost-center</text>

  <rect x="1120" y="802" width="330" height="128" class="ops"/>
  <text x="1135" y="828" class="h">S3 (state do Terraform)</text>
  <text x="1135" y="850" class="t">versionado, lock nativo (use_lockfile)</text>
  <text x="1135" y="870" class="s">sem DynamoDB · criado pelo bootstrap</text>

  <!-- Fluxos -->
  <path d="M210,360 L304,360" class="flowO"/>
  <text x="218" y="344" class="lbl" fill="#ec7000">HTTPS/WSS</text>
  <path d="M480,360 L544,360" class="flowO"/>

  <!-- task → Valkey (lua) -->
  <path d="M640,544 L640,684" class="flowO"/>
  <circle cx="622" cy="612" r="11" fill="#ec7000"/><text x="622" y="616" text-anchor="middle" class="step">1</text>
  <text x="650" y="607" class="s">EVALSHA place_bid.lua</text>
  <text x="650" y="622" class="s">(XADD + PUBLISH no mesmo script)</text>

  <!-- Valkey Pub/Sub → tasks -->
  <path d="M520,684 L520,560" class="flowB"/>
  <circle cx="502" cy="612" r="11" fill="#2563eb"/><text x="502" y="616" text-anchor="middle" class="step">2</text>
  <text x="335" y="616" class="s">Pub/Sub → snapshots WS</text>

  <!-- consumer → stream → RDS -->
  <path d="M917,544 L917,684" class="flowB"/>
  <circle cx="899" cy="612" r="11" fill="#2563eb"/><text x="899" y="616" text-anchor="middle" class="step">3</text>
  <text x="927" y="607" class="s">XREADGROUP → INSERT</text>
  <text x="927" y="622" class="s">→ XACK (write-behind)</text>
  <path d="M710,750 L734,750" class="dash"/>

  <!-- tasks → serviços -->
  <path d="M1050,300 L1114,230" class="dash"/>
  <path d="M1050,330 L1114,320" class="dash"/>
  <path d="M1050,420 L1114,450" class="dash"/>
  <path d="M1050,510 L1114,630" class="dash"/>

  <!-- Legenda -->
  <rect x="40" y="520" width="190" height="230" rx="10" fill="#fff" stroke="#d0d5dd"/>
  <text x="55" y="546" class="h">Fluxo de um lance</text>
  <text x="55" y="572" class="s">1. Lua valida idempotência,</text>
  <text x="55" y="588" class="s">   prazo e valor; aceita com</text>
  <text x="55" y="604" class="s">   INCR seq (ordem única)</text>
  <text x="55" y="628" class="s">2. Evento vai a todas as tasks;</text>
  <text x="55" y="644" class="s">   cada uma envia 1 snapshot</text>
  <text x="55" y="660" class="s">   a cada 150 ms por leilão</text>
  <text x="55" y="684" class="s">3. Consumer grava no Postgres</text>
  <text x="55" y="700" class="s">   e só então faz ACK</text>
  <text x="55" y="728" class="s">── laranja: caminho síncrono</text>
  <text x="55" y="744" class="s">── azul: assíncrono</text>
</svg>
